<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsaMaps - Guiado Hospitalario de Carga Cognitiva Cero</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Encabezado Fijo con Selector de Idioma -->
    <header class="app-header">
        <div class="logo-area">
            <span class="logo-symbol">🏥</span>
            <span class="logo-text">OsaMaps</span>
        </div>
        <button id="lang-toggle-btn" class="lang-btn" onclick="toggleLanguage()" aria-label="Cambiar idioma / Hizkuntza aldatu">
            🌐 EU / ES
        </button>
    </header>

    <main class="main-container">
        <!-- PANTALLA 1: EL ESCÁNER (Inicio) -->
        <section id="screen-scanner" class="screen active">
            <div class="scanner-card">
                <h1 class="instruction-main" id="txt-scan-title">Apunte al código de barras de su cita</h1>
                
                <div class="viewfinder" onclick="simulateBarcodeScan()" role="button" aria-label="Simular escaneo de código de barras">
                    <div class="laser-line"></div>
                    <div class="viewfinder-frame"></div>
                    <p class="viewfinder-hint" id="txt-scan-hint">Toque aquí para simular lectura del pase</p>
                </div>

                <div class="plan-b-section">
                    <label for="destination-select" class="plan-b-label" id="txt-plan-b">¿No funciona? Elija su consulta aquí:</label>
                    <select id="destination-select" class="giant-select" onchange="onManualSelect(this.value)">
                        <option value="" disabled selected id="txt-select-placeholder">-- Seleccionar Destino --</option>
                        <option value="node_cardiology">Analíticas / Cardiología (Planta Baja)</option>
                        <option value="node_radiology">Radiología / Rayos X (Planta 1 - Ascensor)</option>
                        <option value="node_trauma">Traumatología (Planta 2 - Escaleras)</option>
                    </select>
                </div>

                <div class="accessibility-card">
                    <div class="acc-info">
                        <span class="acc-icon" aria-hidden="true">♿</span>
                        <span class="acc-label" id="txt-acc-label">Evitar escaleras</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="no-stairs-toggle" checked onchange="toggleAccessibility(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </section>

        <!-- PANTALLA 2: NAVEGACIÓN (Carrusel Fotográfico con Flechas Vectoriales) -->
        <section id="screen-navigation" class="screen">
            <!-- Barra Gruesa de Progreso -->
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-fill" style="width: 20%;"></div>
                <div id="progress-text" class="progress-text">Paso 1 de 4</div>
            </div>

            <!-- Visor de Realidad Aumentada Estática (Fotografía + Vectores SVG) -->
            <div class="ar-viewport">
                <!-- Fotografía de alta fidelidad del pasillo / nodo -->
                <svg id="ar-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" class="ar-canvas">
                    <defs>
                        <marker id="arrow-head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700"/>
                        </marker>
                    </defs>

                    <!-- Fondo dinámico según el nodo -->
                    <rect id="svg-bg" width="800" height="500" fill="#2C3E50" />
                    
                    <!-- Elementos arquitectónicos simplificados del hospital -->
                    <g id="svg-environment">
                        <!-- Paredes y perspectiva de pasillo -->
                        <polygon points="0,0 250,150 250,400 0,500" fill="#E2E8F0"/>
                        <polygon points="800,0 550,150 550,400 800,500" fill="#CBD5E1"/>
                        <polygon points="250,150 550,150 550,400 250,400" fill="#F8FAFC"/>
                        <polygon points="0,500 250,400 550,400 800,500" fill="#94A3B8"/>
                        <!-- Línea de guiado en el suelo -->
                        <polygon points="380,400 420,400 460,500 340,500" fill="#2563EB"/>
                    </g>

                    <!-- Landmarks gráficos (Mostrador, Puertas, Ascensor) -->
                    <g id="svg-landmarks"></g>

                    <!-- Overlay de flechas vectoriales hiper-visibles (Ultra alto contraste) -->
                    <g id="svg-overlay-vectors">
                        <path id="vector-arrow" d="M 400 460 L 400 280" stroke="#00FF66" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.8))"/>
                        <polygon id="vector-pointer" points="400,230 360,290 440,290" fill="#00FF66"/>
                    </g>
                </svg>

                <button class="tts-repeat-btn" onclick="speakCurrentInstruction()" aria-label="Repetir instrucción en voz alta">
                    🔊 Escuchar
                </button>
            </div>

            <!-- Caja de Texto Gigante -->
            <div class="instruction-card">
                <p id="nav-text-instruction" class="giant-nav-text">Cargando instrucción...</p>
            </div>

            <!-- Botonera de Avance Gigante -->
            <div class="nav-controls">
                <button id="btn-back" class="btn-giant btn-back" onclick="navigateStep(-1)">
                    ⬅️ Atrás
                </button>
                <button id="btn-next" class="btn-giant btn-next" onclick="navigateStep(1)">
                    Siguiente paso ➡️
                </button>
            </div>
        </section>

        <!-- PANTALLA 3: LLEGADA (Confirmación) -->
        <section id="screen-arrival" class="screen">
            <div class="arrival-card">
                <div class="arrival-badge">✓</div>
                <h1 id="arrival-title" class="arrival-title">¡Ha llegado a su destino!</h1>
                
                <div class="arrival-photo-container">
                    <svg viewBox="0 0 600 400" class="arrival-svg">
                        <rect width="600" height="400" fill="#E2E8F0"/>
                        <!-- Puerta de la Consulta -->
                        <rect x="200" y="80" width="200" height="320" fill="#1E293B" rx="8"/>
                        <circle cx="230" cy="240" r="10" fill="#FFD700"/>
                        <!-- Cartel Consulta 14 -->
                        <rect x="220" y="110" width="160" height="70" fill="#2563EB" rx="6"/>
                        <text x="300" y="142" font-size="22" font-family="sans-serif" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CONSULTA 14</text>
                        <text x="300" y="166" font-size="16" font-family="sans-serif" fill="#E0F2FE" text-anchor="middle">Cardiología / Analíticas</text>
                    </svg>
                </div>

                <p id="arrival-message" class="arrival-message">Por favor, tome asiento en la sala de espera. Su médico le llamará por pantalla.</p>

                <button class="btn-giant btn-restart" onclick="resetApp()">
                    🏠 Volver al inicio
                </button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
