<!DOCTYPE html>
<html lang="eu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OsaMaps - Login</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase.js" defer></script>
        <script src="js/auth.js" defer></script>
    </head>
    <body>
        <div class="auth-container">
            <h2>OsaMaps</h2>

            <div id="auth-message" class="message hidden"></div>
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Posta elektronikoa (Email)</label>
                    <input type="email" id="email" required placeholder="adibidea@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Pasahitza (Contraseña)</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <div class="button-group">
                    <button type="submit" id="btn-login" class="btn primary">Hasi saioa (Login)</button>
                    <button type="button" id="btn-signup" class="btn secondary">Erregistratu (Registro)</button>
                </div>
            </form>
            <div id="user-panel" class="hidden">
                <p>Kaixo, <strong id="user-email"></strong>!</p>
                <button id="btn-logout" class="btn danger">Amaitu saioa (Cerrar sesión)</button>
            </div>
        </div>
    </body>
</html>
